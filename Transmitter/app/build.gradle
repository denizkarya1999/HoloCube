plugins {
    id 'com.android.application'
}

android {
    namespace 'com.developer27.holocube.transmitter'
    compileSdk 36

    defaultConfig {
        applicationId 'com.developer27.holocube.transmitter'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        warningsAsErrors true
        // Keep the verified toolchain pinned; available upgrades are not app defects.
        disable 'AndroidGradlePluginVersion', 'GradleDependency'
    }
}

dependencies {
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
