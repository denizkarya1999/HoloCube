name: HoloCube Transmitter Android

on:
  push:
    branches: [main]
    paths: ['Transmitter/**', '.github/workflows/transmitter-android.yml']
  pull_request:
    paths: ['Transmitter/**', '.github/workflows/transmitter-android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Transmitter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build APK and device tests; run Android lint
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HoloCube-Transmitter-debug
          path: Transmitter/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HoloCube-Transmitter-lint
          path: Transmitter/app/build/reports/lint-results-debug.*
